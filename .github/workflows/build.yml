name: Build RyluneSmooth
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build mod
        run: gradle --no-daemon build
      - name: Upload installable jar
        uses: actions/upload-artifact@v4
        with:
          name: RyluneSmooth-Fabric-1.21.11
          path: build/libs/rylunesmooth-1.21.11-0.1.0.jar
