name: Release RyluneSmooth v0.1.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rylunesmooth-release-v0.1.0
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish v0.1.0
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build distributable Fabric JAR
        run: gradle --no-daemon build

      - name: Verify built JAR and Fabric metadata
        shell: bash
        run: |
          set -euo pipefail
          JAR='build/libs/rylunesmooth-1.21.11-0.1.0.jar'
          test -s "$JAR"
          unzip -t "$JAR" > /dev/null
          unzip -p "$JAR" fabric.mod.json | grep -q '"id": "rylunesmooth"'
          unzip -l "$JAR" | grep -q 'assets/rylunesmooth/icon.png'

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.1.0 > /dev/null 2>&1; then
            echo 'Release v0.1.0 already exists; not overwriting it.'
            exit 0
          fi
          gh release create v0.1.0 \
            'build/libs/rylunesmooth-1.21.11-0.1.0.jar#RyluneSmooth Fabric 1.21.11' \
            --title 'RyluneSmooth v0.1.0' \
            --target "$GITHUB_SHA" \
            --notes-file RELEASE_NOTES.md

      - name: Upload workflow build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RyluneSmooth-Fabric-1.21.11
          path: build/libs/rylunesmooth-1.21.11-0.1.0.jar
